# Builds the Windows app on every push to main and publishes it as the
# "latest" release, so friends always have one download link.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/MusicHost | Out-Null
          Copy-Item target/release/music-host.exe "dist/MusicHost/Music Host.exe"
          Copy-Item README.md dist/MusicHost/
          Compress-Archive -Path dist/MusicHost/* -DestinationPath dist/MusicHost-Windows.zip -Force
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Music Host for Windows
          prerelease: false
          make_latest: true
          body: |
            **Download `MusicHost-Windows.zip`**, unzip it, and run **Music Host.exe**.

            Windows may say "Windows protected your PC" because the app isn't signed —
            click **More info → Run anyway**.

            Built from ${{ github.sha }}.
          files: dist/MusicHost-Windows.zip
